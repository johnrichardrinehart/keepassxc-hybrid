[package]
name = "keepassxc-hybrid"
version = "0.1.0"
edition = "2021"
description = "Answer WebAuthn hybrid (caBLE) QR codes with KeePassXC passkeys"
license = "MIT"
repository = "https://github.com/johnrichardrinehart/keepassxc-hybrid"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bluer = { version = "0.17", features = ["bluetoothd"] }
clap = { version = "4", features = ["derive", "env"] }
crypto_box = { version = "0.9", features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rxing = { version = "0.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1"
# The user handle in getAssertion responses (CTAP 0x04) is not upstream yet.
webauthn-authenticator-rs = { git = "https://github.com/johnrichardrinehart/webauthn-rs", rev = "1a9aa6f09941b43c87185671a7751f8acc7f6602", features = ["cable"] }
webauthn-rs-proto = { git = "https://github.com/johnrichardrinehart/webauthn-rs", rev = "1a9aa6f09941b43c87185671a7751f8acc7f6602" }

[dev-dependencies]
serde_cbor_2 = "0.13"
sha2 = "0.10"
tempfile = "3"
webauthn-rs = { git = "https://github.com/johnrichardrinehart/webauthn-rs", rev = "1a9aa6f09941b43c87185671a7751f8acc7f6602", features = ["conditional-ui"] }
